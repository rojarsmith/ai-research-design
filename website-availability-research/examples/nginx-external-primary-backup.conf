# Run on external ingress C, not on A. Include inside nginx's http context.
# Reserved documentation IPs: replace with real origin addresses.
# Both origins must have a trusted certificate for example.com on HTTPS 443.
# This example assumes B is a compatible full application standby.
upstream primary_standby {
    zone primary_standby 64k;
    server 192.0.2.10:443 max_fails=2 fail_timeout=15s;
    server 198.51.100.20:443 backup;
}

server {
    listen 127.0.0.1:8080;
    server_name example.com;
    root /srv/maintenance;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_ssl_name example.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    error_page 502 503 504 =503 /maintenance.html;

    location / {
        proxy_pass https://primary_standby;
        proxy_intercept_errors on;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;
    }

    location = /api {
        error_page 502 503 504 =503 /maintenance.json;
        proxy_pass https://primary_standby;
        proxy_intercept_errors on;
        proxy_next_upstream off;
    }

    # Do not replay an API request against another origin automatically.
    location ^~ /api/ {
        error_page 502 503 504 =503 /maintenance.json;
        proxy_pass https://primary_standby;
        proxy_intercept_errors on;
        proxy_next_upstream off;
    }

    location = /maintenance.html {
        internal;
        charset utf-8;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }

    location = /maintenance.json {
        internal;
        types { }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }
}
