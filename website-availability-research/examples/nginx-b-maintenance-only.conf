# B is a maintenance-only origin for external DNS failover or an HTTP LB.
# Template: include inside http context. Add origin HTTPS before deployment.
server {
    listen 127.0.0.1:8080;
    server_name example.com;
    root /srv/maintenance;

    error_page 503 =503 /maintenance.html;

    # Probe this endpoint to check B's ability to serve its maintenance role.
    location = /readyz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "maintenance-origin-ready\n";
    }

    location / { return 503; }

    location = /api {
        error_page 503 =503 /maintenance.json;
        return 503;
    }

    location ^~ /api/ {
        error_page 503 =503 /maintenance.json;
        return 503;
    }

    location = /maintenance.html {
        internal;
        charset utf-8;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }

    location = /maintenance.json {
        internal;
        types { }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }
}
