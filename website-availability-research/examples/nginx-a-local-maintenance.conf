# Template: include inside nginx's http context. Development listener only.
# Copy maintenance.html and maintenance.json to /srv/maintenance/.
# Application on A: 127.0.0.1:8000. Adapt HTTPS and addresses before deployment.
server {
    listen 127.0.0.1:8080;
    server_name example.com;
    root /srv/maintenance;

    error_page 502 503 504 =503 /maintenance.html;

    location / {
        if (-f /etc/nginx/site-maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors on;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api without a trailing slash must receive JSON too.
    location = /api {
        error_page 502 503 504 =503 /maintenance.json;
        if (-f /etc/nginx/site-maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors on;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        error_page 502 503 504 =503 /maintenance.json;
        if (-f /etc/nginx/site-maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_intercept_errors on;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness is NOT replaced with an HTML maintenance page.
    location = /readyz {
        error_page 502 503 504 =503 @not_ready;
        if (-f /etc/nginx/site-maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:8000/readyz;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location @not_ready {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 503 "not-ready\n";
    }

    location = /maintenance.html {
        internal;
        charset utf-8;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }

    location = /maintenance.json {
        internal;
        types { }
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        add_header X-Availability-Mode "maintenance" always;
    }
}
