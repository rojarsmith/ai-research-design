<script id="catalog-data" type="application/json">{"events": [{"key": "kernel-power-41", "provider": "Kernel-Power", "ids": [41], "priority": "first", "level": "Critical", "en": {"title": "Investigate the unexpected restart", "meaning": "Windows detected an incomplete shutdown. Event 41 records the outcome; it does not identify a faulty power supply or prove a blue screen.", "evidence": "Full XML: BugcheckCode, BugcheckParameter1–4, PowerButtonTimestamp and SleepInProgress. Also collect WER-SystemErrorReporting 1001, WHEA-Logger and preceding storage or display events.", "steps": ["Open Event 6008 to find the previous shutdown time, then inspect events before that time; the Event 41 logging time can belong to the next boot.", "If BugcheckCode is nonzero, convert the decimal value to hexadecimal and analyze the matching dump. If zero, power loss, a hang or an unrecorded crash remain possible.", "Record the workload and recent changes. Test one reversible change at a time: return overclock/undervolt settings to known stable values, or roll back a driver when timing supports it. Check power connections and temperatures."], "verify": "Repeat the original workload and compare restart frequency. A quiet event list after one reboot is insufficient.", "avoid": "Do not replace the PSU or change DCOM permissions based solely on Event 41."}, "zh-TW": {"title": "追查非正常重新啟動", "meaning": "Windows 偵測到未完整關機。事件 41 記錄結果，不能據此判定電源供應器故障或確認曾藍畫面。", "evidence": "完整 XML：BugcheckCode、BugcheckParameter1–4、PowerButtonTimestamp 與 SleepInProgress。另蒐集 WER-SystemErrorReporting 1001、WHEA-Logger，以及先前的儲存或顯示事件。", "steps": ["開啟事件 6008 找出上次關機時間，再查看該時間之前的事件；事件 41 的記錄時間可能屬於下一次開機。", "BugcheckCode 非零時，將十進位轉為十六進位並分析對應傾印。若為零，仍可能是斷電、當機或未能記錄的崩潰。", "記錄當時負載與近期變更。一次測試一項可還原變更，例如恢復已知穩定的超頻／降壓設定，或在時間證據支持下回復驅動。檢查供電連接與溫度。"], "verify": "重現原本負載並比較重啟頻率；僅一次重啟後沒有新事件不足以確認修復。", "avoid": "勿僅憑事件 41 就更換電源或修改 DCOM 權限。"}, "sources": ["power", "reboots"]}, {"key": "volmgr-161", "provider": "volmgr", "ids": [161], "priority": "first", "level": "Error", "en": {"title": "Restore useful crash evidence", "meaning": "A common interpretation is failed crash-dump creation. Confirm the actual message and status data on this PC; the screenshot does not show them. A missing dump does not identify the crashing component.", "evidence": "General text, device/volume name, status or BugCheckProgress if present; dump settings, pagefile configuration, disk free space and existing dump timestamps.", "steps": ["Check Startup and Recovery → Write debugging information. For normal troubleshooting, consider Automatic memory dump and a system-managed paging file on the Windows volume, with enough free space.", "Check C:\\Windows\\MEMORY.DMP and C:\\Windows\\Minidump. Preserve existing evidence before changing settings; the collector only inventories these files.", "If storage errors recur before the incident, back up data first, then check the identified disk and controller using manufacturer diagnostics. A hard power cut may still prevent a dump despite correct settings."], "verify": "After a naturally recurring crash, confirm a new readable dump and inspect whether 161 recurs. Do not deliberately crash the PC.", "avoid": "Do not assume Event 161 proves SSD failure or manually delete the pagefile."}, "zh-TW": {"title": "恢復可用的崩潰證據", "meaning": "常見解讀為崩潰傾印建立失敗，須確認這台 PC 的實際訊息與狀態資料；截圖並未顯示。缺少傾印不能判定是哪個元件導致崩潰。", "evidence": "一般訊息、裝置／磁碟區名稱、狀態或 BugCheckProgress（若有）；傾印設定、分頁檔設定、可用空間及既有傾印時間。", "steps": ["檢查「啟動及修復」→「寫入偵錯資訊」。一般排查可考慮「自動記憶體傾印」，Windows 磁碟區使用系統管理的分頁檔，並保留足夠空間。", "檢查 C:\\Windows\\MEMORY.DMP 與 C:\\Windows\\Minidump。變更前保留既有證據；蒐集工具只列出這些檔案資訊。", "若事故前持續出現儲存錯誤，先備份，再用製造商診斷檢查已識別的磁碟與控制器。即使設定正確，突然斷電仍可能無法產生傾印。"], "verify": "自然再次發生崩潰後，確認有新的可讀傾印並檢查 161 是否重現；不要故意讓 PC 崩潰。", "avoid": "勿認定事件 161 證明 SSD 故障，也不要手動刪除分頁檔。"}, "sources": ["automatic-dump", "dump-types"]}, {"key": "eventlog-6008", "provider": "EventLog", "ids": [6008], "priority": "first", "level": "Error", "en": {"title": "Find the actual shutdown time", "meaning": "The previous shutdown was unexpected. This corroborates Event 41 but does not add an independent root cause.", "evidence": "The shutdown date/time inside General and the event's separate TimeCreated value. Record the PC time zone.", "steps": ["Use the shutdown time embedded in the message to anchor the incident window.", "Compare User32 1074, Kernel-General boot/shutdown entries and WER-SystemErrorReporting 1001. Preserve information-level entries as well as errors.", "Continue with the Event 41 workflow instead of treating 6008 as a second hardware fault."], "verify": "After the underlying problem is resolved, ordinary shutdown/restart cycles should have an expected shutdown sequence.", "avoid": "Do not confuse the event logging time with the time the PC lost power."}, "zh-TW": {"title": "找出真正的關機時間", "meaning": "上次關機非正常結束，可與事件 41 相互印證，但不代表另一個獨立根因。", "evidence": "「一般」內的關機日期／時間，以及事件本身不同的 TimeCreated。記錄 PC 時區。", "steps": ["使用訊息內的關機時間作為事故時間窗基準。", "比對 User32 1074、Kernel-General 開關機紀錄及 WER-SystemErrorReporting 1001。資訊層級事件也要保留。", "接續事件 41 的流程，不要把 6008 當作第二項硬體故障。"], "verify": "根因解決後，正常關機／重啟應呈現預期的事件順序。", "avoid": "勿將事件記錄時間誤認為 PC 斷電時間。"}, "sources": ["reboots"]}, {"key": "application-error-1000", "provider": "Application Error", "ids": [1000], "priority": "symptom", "level": "Error", "en": {"title": "Identify the application that crashed", "meaning": "An application crash entry. The visible 17:33:29 entry is roughly an hour before the restart cluster; a causal link is unproven.", "evidence": "Faulting application and module names/paths/versions, exception code, fault offset, process ID and report ID; matching Windows Error Reporting entries.", "steps": ["Open Reliability Monitor with perfmon /rel and match the application and time.", "Reproduce that application's failure separately. Update or repair the identified app, or roll back a recent relevant change.", "If it still fails, collect an app-specific WER dump with the documented method. A fault in ntdll.dll or KERNELBASE.dll alone does not prove Windows itself is the cause."], "verify": "Repeat the same app action and check that the crash and corresponding 1000 entries stop recurring.", "avoid": "Do not reinstall Windows before identifying the executable."}, "zh-TW": {"title": "識別崩潰的應用程式", "meaning": "應用程式崩潰紀錄。可見的 17:33:29 紀錄約比重啟群組早一小時，尚未證明因果關係。", "evidence": "失敗的應用程式與模組名稱／路徑／版本、例外代碼、位移、處理程序 ID 及報告 ID；相符的 Windows Error Reporting 紀錄。", "steps": ["以 perfmon /rel 開啟可靠性監視器，比對程式與時間。", "單獨重現該程式的故障。更新或修復已識別的程式，或回復近期相關變更。", "若仍失敗，依官方方式蒐集個別應用程式的 WER 傾印。僅顯示 ntdll.dll 或 KERNELBASE.dll 出錯，不能證明根因在 Windows。"], "verify": "重複相同操作，確認崩潰與對應 1000 紀錄不再持續發生。", "avoid": "尚未識別執行檔之前，不宜直接重裝 Windows。"}, "sources": ["app-crash", "wer"]}, {"key": "dcom-10029", "provider": "DistributedCOM", "ids": [10029], "priority": "symptom", "level": "Error", "en": {"title": "Read the named COM target first", "meaning": "A COM activation/service problem is a working hypothesis. The screenshot does not identify the CLSID, service or error. No universal fix is established here.", "evidence": "Full General/XML, CLSID or class name, service name and HRESULT/status. Identify the owning software before applying a remedy.", "steps": ["Check whether the message actually reports an activation timeout and names a service waiting to stop.", "If the message specifically names AppCaptureManager/BcastDVRUserService and capture fails, test recording settings and repair/update the relevant capture app. This is a conditional branch, not an identification of this PC's issue.", "For other targets, troubleshoot that exact app/service and its dependencies. Compare recurrence during healthy operation and during the affected action."], "verify": "The identified operation succeeds and the same target's error no longer repeats under the original trigger.", "avoid": "Do not apply Event 10016 permission edits or assume every 10029 is Xbox/Game Bar."}, "zh-TW": {"title": "先讀取訊息中的 COM 目標", "meaning": "COM 啟用／服務問題只是待驗證假設。截圖無法識別 CLSID、服務或錯誤；此處沒有已確認的通用修法。", "evidence": "完整一般訊息／XML、CLSID 或類別名稱、服務名稱及 HRESULT／狀態。處理前先識別所屬軟體。", "steps": ["確認訊息是否真的描述啟用逾時，以及是否指向等待停止的服務。", "若訊息明確提到 AppCaptureManager／BcastDVRUserService 且錄影失敗，可測試錄影設定並修復／更新相關錄影程式。此為條件分支，不代表已識別這台 PC 的問題。", "其他目標應排查該程式／服務及其相依元件，比較正常運作與故障操作時的重現情況。"], "verify": "已識別的操作可成功，且原本觸發條件下同一目標的錯誤不再重複。", "avoid": "勿套用事件 10016 的權限修改，也勿認定所有 10029 都是 Xbox／Game Bar。"}, "sources": []}, {"key": "trace-28", "provider": "Kernel-EventTracing", "ids": [28], "priority": "symptom", "level": "Error", "en": {"title": "Identify the tracing provider", "meaning": "This belongs to Event Tracing for Windows. If General reports an error setting provider traits, investigate that provider and status. The selected row alone cannot identify a device or driver.", "evidence": "ProviderGuid in EventData, ErrorCode, channel and execution context. Distinguish the tracing event publisher's GUID from the provider GUID named in the payload.", "steps": ["Copy General and XML. Compare provider GUIDs across the three visible entries.", "Look up the named provider in registered provider metadata where available; do not infer a headset, USB controller or GPU from an online GUID anecdote.", "If a matching device or app also fails, update/roll back that identified component and test. If tracing alone fails after boot without symptoms, monitor after the restart investigation."], "verify": "The original device/app operation and tracing registration work; compare the same provider and status after a normal boot.", "avoid": "Do not disable tracing channels to conceal evidence."}, "zh-TW": {"title": "識別追蹤提供者", "meaning": "此事件屬於 Windows 事件追蹤。若一般訊息指出設定提供者 traits 失敗，再排查該提供者與狀態。僅選取的清單列無法識別裝置或驅動。", "evidence": "EventData 內的 ProviderGuid、ErrorCode、通道及執行脈絡。須區分發布此追蹤錯誤的 GUID 與事件資料內被點名的提供者 GUID。", "steps": ["複製一般訊息與 XML，比對三筆可見事件的提供者 GUID。", "若有註冊的提供者中繼資料，可用來查核；不要從網路上的 GUID 個案就認定是耳機、USB 控制器或 GPU。", "若對應裝置或程式也故障，更新／回復已識別元件並測試。若僅開機後追蹤失敗且無症狀，可在重啟問題處理後觀察。"], "verify": "原本裝置／程式操作及追蹤註冊正常；正常開機後比較相同提供者與狀態。", "avoid": "勿停用追蹤通道來隱藏證據。"}, "sources": ["etw"]}, {"key": "eventlog-1101", "provider": "Eventlog", "ids": [1101], "priority": "symptom", "level": "Error", "en": {"title": "Check whether audit records were lost", "meaning": "If the actual message says audit events were dropped by the transport, some audit evidence is missing. Confirm General, channel and reason code; a screenshot-only diagnosis is provisional.", "evidence": "Full message/XML, Reason if present, Security log size/retention and whether it recurs without shutdowns.", "steps": ["Export Security as well as System and Application for the incident window. Access to Security may need an elevated session.", "After normal operation resumes, check whether loss persists. Investigate repeated logging failures, capacity and storage problems if it does.", "On a managed PC, report continuing audit loss to IT; policy and retention changes require the organization's context."], "verify": "Audit-loss events stop recurring during representative normal operation and the expected audit records are available.", "avoid": "Do not clear the Security log or disable auditing as a fix."}, "zh-TW": {"title": "確認是否遺失稽核紀錄", "meaning": "若實際訊息表示傳輸過程丟棄稽核事件，代表部分稽核證據缺失。須確認一般訊息、通道及原因碼；僅依截圖的判讀仍屬暫定。", "evidence": "完整訊息／XML、Reason（若有）、Security 日誌大小／保留方式，以及是否在沒有關機時也發生。", "steps": ["匯出事故時間窗內的 Security、System 與 Application；讀取 Security 可能需要系統管理員權限。", "恢復正常操作後，檢查遺失是否持續。若持續，排查重複的記錄失敗、容量與儲存問題。", "受管理 PC 若持續遺失稽核，應交由 IT 處理；政策及保留設定需依組織情境調整。"], "verify": "在具代表性的正常操作期間，稽核遺失事件不再持續發生，且預期紀錄存在。", "avoid": "勿把清除 Security 日誌或停用稽核當作修法。"}, "sources": ["event-query"]}, {"key": "appmodel", "provider": "AppModel-State", "ids": [20, 21, 23, 24], "priority": "symptom", "level": "Warning", "en": {"title": "Inspect the affected app package", "meaning": "These entries need the package name, operation and result. They may describe app-state repair attempts/results; four IDs do not necessarily mean four unrelated faults.", "evidence": "Package full name, operation such as LocalSettings/SettingsInitialize, error code and repair result; whether Start, Search or an app actually fails.", "steps": ["Identify the exact package and reproduce its symptom before making changes.", "Use the app's supported Repair option first. Reset/reinstall only the identified app if needed after preserving its local data; reset can erase settings.", "For Start/Search failures, follow the official Start menu diagnostic workflow and compare a separate test user profile to isolate profile-specific behavior."], "verify": "The affected app works and the same package/operation no longer produces a continuing failure loop.", "avoid": "Do not delete StateRepository databases or re-register every AppX package indiscriminately."}, "zh-TW": {"title": "檢查受影響的應用程式套件", "meaning": "這些紀錄需要套件名稱、操作與結果，可能描述應用狀態修復嘗試／結果；四個 ID 不一定代表四項獨立故障。", "evidence": "完整套件名稱、LocalSettings／SettingsInitialize 等操作、錯誤代碼及修復結果；開始功能表、搜尋或程式是否確實失敗。", "steps": ["先識別確切套件並重現症狀，再進行變更。", "優先使用該程式支援的「修復」。必要時備份本機資料後，僅重設／重裝已識別程式；重設可能清除設定。", "開始功能表／搜尋故障依官方排查流程處理，並用另一個測試使用者設定檔比較，確認是否僅影響原設定檔。"], "verify": "受影響程式可正常使用，同一套件／操作不再持續進入失敗循環。", "avoid": "勿任意刪除 StateRepository 資料庫或全面重新註冊所有 AppX 套件。"}, "sources": ["start-menu"]}, {"key": "codex-1003", "provider": "CodexSandboxService.OpenAI.Codex", "ids": [1003], "priority": "symptom", "level": "Error", "en": {"title": "Capture the sandbox service error", "meaning": "Two service errors are visible at 18:38:28. The exact Event 1003 definition and failure cause are not established by the documentation checked. Their proximity to the restart is correlation only.", "evidence": "General/XML, installed app version, failing action, process/service exit or status code, and whether the problem persists after a normal startup.", "steps": ["Reproduce a small sandbox operation and record the exact failure; preserve work before restarting the app.", "Inspect the app's available update and diagnostics controls. If reproducible, repair/update the owning app through its supported installation path.", "Keep sandbox security controls enabled. Use the full error and reproduction when contacting product support; do not assume the service caused the system restart."], "verify": "The previously failing sandbox operation succeeds repeatedly after normal startup.", "avoid": "Do not grant broad permissions or disable the sandbox to silence Event 1003."}, "zh-TW": {"title": "蒐集沙箱服務的完整錯誤", "meaning": "18:38:28 可見兩筆服務錯誤。查核的文件未能建立事件 1003 的確切定義或原因；與重啟時間接近只代表相關，不能證明因果。", "evidence": "一般訊息／XML、已安裝程式版本、失敗操作、處理程序／服務結束或狀態碼，以及正常開機後是否持續發生。", "steps": ["重現一個簡單沙箱操作並記錄完整錯誤；重啟程式前保留工作。", "檢查程式可用的更新及診斷功能。若可重現，透過受支援的安裝方式修復／更新所屬程式。", "保持沙箱安全控制啟用。聯絡產品支援時提供完整錯誤與重現步驟，不要認定該服務導致整台電腦重啟。"], "verify": "正常開機後，原本失敗的沙箱操作可重複成功。", "avoid": "勿為了消除事件 1003 就授予廣泛權限或停用沙箱。"}, "sources": ["openai-sandbox"]}, {"key": "cowork-1", "provider": "CoworkVMService", "ids": [1], "priority": "symptom", "level": "Warning", "en": {"title": "Identify the VM service owner", "meaning": "A warning from a named service at 18:38:29. Ownership, event semantics and VM requirements are unknown from the screenshot; the name alone does not prove a specific vendor or hypervisor failure.", "evidence": "Full warning, executable path, publisher signature, installed app/version, dependency/status information and the VM action that fails.", "steps": ["Inspect the service's executable and signature to identify the installed software. Do not run an unknown executable just to inspect it.", "Check the owning app's requirements and actual VM startup error. Check virtualization settings only if those requirements and the error indicate a need.", "Repair/update the identified app if its VM operation fails after normal startup; otherwise monitor after resolving the restart."], "verify": "The owning app's VM starts and completes the original workload without the same warning/failure.", "avoid": "Do not change Hyper-V, VBS or BIOS virtualization settings based only on the service name."}, "zh-TW": {"title": "識別 VM 服務所屬軟體", "meaning": "18:38:29 出現該服務的警告。截圖無法確認所屬軟體、事件意義及 VM 需求；名稱本身不足以證明特定廠商或虛擬化平台故障。", "evidence": "完整警告、執行檔路徑、發行者簽章、已安裝程式／版本、相依／狀態資訊，以及失敗的 VM 操作。", "steps": ["檢查服務執行檔與簽章以識別軟體，不要為了檢查而執行未知檔案。", "核對所屬程式需求及實際 VM 啟動錯誤；只有需求與錯誤指向時，才檢查虛擬化設定。", "正常開機後若 VM 操作仍失敗，修復／更新已識別程式；否則先在重啟問題解決後觀察。"], "verify": "所屬程式的 VM 可啟動並完成原負載，沒有相同警告／故障。", "avoid": "勿僅憑服務名稱修改 Hyper-V、VBS 或 BIOS 虛擬化設定。"}, "sources": []}, {"key": "dcom-10016", "provider": "DistributedCOM", "ids": [10016], "priority": "monitor", "level": "Warning", "en": {"title": "Check for the documented benign pattern", "meaning": "Microsoft documents specific DCOM permission events generated by an expected retry pattern. Matching entries without a functional symptom can be left alone. This does not classify every 10016 as harmless.", "evidence": "CLSID, APPID, security context/SID and the exact permission message; compare them with Microsoft's examples.", "steps": ["If the message matches the documented pattern and the component works, take no repair action.", "If functionality fails or the target differs, investigate that component using its full message.", "For readability, use a custom view after preserving evidence; filtering changes the display, not the underlying fault."], "verify": "The relevant component works. For documented benign events, eliminating the warning count is not a repair criterion.", "avoid": "Microsoft advises against changing DCOM permissions merely to suppress these documented events."}, "zh-TW": {"title": "比對官方記載的可忽略模式", "meaning": "Microsoft 記載了特定 DCOM 權限事件，由預期的重試行為產生。內容相符且功能正常時可不處理；這不代表所有 10016 都無害。", "evidence": "CLSID、APPID、安全性脈絡／SID 及完整權限訊息，與 Microsoft 範例比對。", "steps": ["若訊息符合官方模式且元件正常，不需修復。", "若功能失敗或目標不同，使用完整訊息排查該元件。", "保留證據後可用自訂檢視改善閱讀；篩選只是改變顯示，不是修復根因。"], "verify": "相關元件正常運作。對已知可忽略事件，警告數歸零不是修復標準。", "avoid": "Microsoft 不建議僅為消除這些已記載事件而修改 DCOM 權限。"}, "sources": ["dcom"]}, {"key": "registration-360", "provider": "User Device Registration", "ids": [360], "priority": "monitor", "level": "Warning", "en": {"title": "Check whether business provisioning is expected", "meaning": "If General says Windows Hello for Business provisioning will not launch, inspect prerequisite results. On an unmanaged personal PC, business provisioning may not be required. This is separate from assuming personal PIN sign-in is broken.", "evidence": "Full prerequisite results and the actual sign-in symptom. For managed PCs, device join and policy state; dsregcmd /status output contains identifiers.", "steps": ["If sign-in works and no business enrollment is intended, observe rather than forcing enrollment.", "If business provisioning is required, check join/account/policy and other prerequisites with IT using dsregcmd /status.", "If personal PIN/biometric sign-in fails, troubleshoot that specific symptom instead of treating business enrollment as the automatic cause."], "verify": "The intended sign-in method works; on managed PCs, intended provisioning completes.", "avoid": "Do not clear the TPM, delete credentials or disconnect an organization account merely to remove this warning."}, "zh-TW": {"title": "確認是否需要企業佈建", "meaning": "若一般訊息指出 Windows Hello for Business 佈建不會啟動，應查看先決條件結果。未受管理的個人 PC 可能不需要企業佈建；不能因此認定個人 PIN 登入故障。", "evidence": "完整先決條件結果及實際登入症狀。受管理 PC 另需加入與政策狀態；dsregcmd /status 會包含識別資料。", "steps": ["登入正常且無企業註冊需求時，先觀察，不要強制佈建。", "需要企業佈建時，使用 dsregcmd /status 並與 IT 核對裝置加入、帳號、政策及其他先決條件。", "若個人 PIN／生物辨識登入失敗，應針對該症狀排查，不要自動歸因於企業註冊。"], "verify": "預期的登入方式可正常使用；受管理 PC 則需完成預期佈建。", "avoid": "勿僅為消除警告就清除 TPM、刪除憑證或中斷組織帳號連線。"}, "sources": ["hello", "hello-enroll"]}], "sources": {"power": ["Microsoft: Event 41 troubleshooting", "https://learn.microsoft.com/en-us/troubleshoot/windows-client/performance/event-id-41-restart"], "reboots": ["Microsoft: Unexpected reboot investigation", "https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-unexpected-reboots-system-event-logs"], "automatic-dump": ["Microsoft: Automatic memory dump", "https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/automatic-memory-dump"], "dump-types": ["Microsoft: Kernel dump types", "https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/varieties-of-kernel-mode-dump-files"], "dcom": ["Microsoft: Documented DCOM 10016 pattern", "https://learn.microsoft.com/en-us/troubleshoot/windows-client/application-management/event-10016-logged-when-accessing-dcom"], "app-crash": ["Microsoft: Application/service crashes", "https://learn.microsoft.com/en-us/troubleshoot/windows-server/performance/troubleshoot-application-service-crashing-behavior"], "wer": ["Microsoft: Collecting user-mode dumps", "https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps"], "etw": ["Microsoft: Event Tracing for Windows", "https://learn.microsoft.com/en-us/windows/win32/etw/event-tracing-portal"], "start-menu": ["Microsoft: Start menu troubleshooting", "https://learn.microsoft.com/en-us/troubleshoot/windows-client/shell-experience/troubleshoot-start-menu-errors"], "hello": ["Microsoft: Windows Hello for Business prerequisites", "https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/hello-hybrid-cloud-kerberos-trust-provision"], "hello-enroll": ["Microsoft: Business enrollment diagnostics", "https://learn.microsoft.com/en-us/windows/security/identity-protection/hello-for-business/deploy/hybrid-cert-trust-enroll"], "event-query": ["Microsoft: Get-WinEvent", "https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.diagnostics/get-winevent"], "event-export": ["Microsoft: wevtutil", "https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil"], "repair": ["Microsoft: DISM/SFC repair workflow", "https://learn.microsoft.com/en-us/troubleshoot/windows-server/installing-updates-features-roles/fix-windows-update-errors"], "openai-sandbox": ["OpenAI: Windows sandbox", "https://learn.chatgpt.com/docs/windows/windows-sandbox"]}}</script>
<script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog-data').textContent);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy={
en:{eyebrow:'Windows diagnostics · Checked 12 Oct 2026',heading:'Find the cause.\nFix the symptom.',intro:'An evidence-first guide to PC failures. Start with the restart, identify the affected component, and verify the original workload.',status:'ROOT CAUSE UNDETERMINED',caseTitle:'Case 001 / Event Viewer',caseNote:'The screenshot contains an unexpected-shutdown cluster. Investigate Kernel-Power 41, EventLog 6008 and the possible volmgr 161 dump failure first.',caseLimit:'Screenshot: 3 Oct 2026 · Full messages and dumps unavailable. 29,756 entries is not a crash count.',catalogLink:'Explore the events ↓',workflowLink:'Troubleshooting workflow',reportLink:'Full English report',catalogLabel:'01 / Event catalog',catalogTitle:'What needs attention?',catalogIntro:'12 groups cover all 15 distinct IDs visible in the screenshot. Priority is a proposed investigation order. Open an entry for evidence, steps and verification.',expand:'Expand results',collapse:'Collapse results',searchLabel:'Search by event ID, provider or symptom',searchPlaceholder:'Try 41, AppModel-State, dump…',priorityLabel:'Triage priority',all:'All priorities',first:'Investigate first',symptom:'If functionality fails',monitor:'Compare & monitor',reset:'Reset filters',meaning:'Interpretation',evidence:'Evidence needed',steps:'What to do',verify:'How to verify',avoid:'Avoid',unknown:'Event-specific authoritative definition not established; proposed diagnostics.',empty:'No matching events. Try another ID, symptom or priority.',result:n=>`${n} event ${n===1?'group':'groups'} shown`,timelineLabel:'02 / Screenshot observations',timelineTitle:'Read the sequence carefully.',timeNote:'Displayed local times on 3 Oct 2026. The screenshot does not establish its UTC offset.',timeLimit:'Logged time is not always incident time. Read the previous shutdown time inside Event 6008; then sort exported records by UTC. Startup aftermath is a hypothesis, not an established cause.',timelineHead:['Displayed time','Visible entries'],timelineRows:[['17:28 onward','Repeated DCOM 10029/10016; Application Error 1000 at 17:33:29'],['18:38:01 / 18:38:08','volmgr 161 / Kernel-Power 41'],['18:38:19','Three Kernel-EventTracing 28 entries'],['18:38:26','EventLog 6008, Eventlog 1101 and DCOM'],['18:38:28–18:38:31','Sandbox/VM services, AppModel-State, DCOM and registration warnings']],workflowLabel:'03 / Reusable process',workflowTitle:'Use symptoms to direct the investigation.',workflowText:'The full workflow covers blue screens, hangs, black screens, slow PCs, disk errors, network failures, USB/audio disconnects, app crashes and sleep/wake problems. Record one change at a time and compare the same workload.',workflowDoc:'Read the full workflow →',evidenceTitle:'Before changing anything',evidenceSteps:['Record the symptom, PC/Windows/app versions, recent changes and time zone.','Preserve System, Application, Security and relevant channel logs, including information events and full XML.','Check 6008, bugcheck details and existing dumps. A collector is available in scripts/Collect-Evidence.ps1 for manual use.','Record each test and rollback; confirm the original symptom improves over a comparable observation period.'],caseTemplate:'Open a case template →',privacy:'The collector only queries settings/logs and writes local evidence; it does not run repairs or upload data. Raw logs and dumps may contain private information. Keep them outside Git. This page does not automatically inspect your PC.',sourcesTitle:'Sources & evidence boundaries',sourcesNote:'Official references checked on 12 Oct 2026. A technology reference does not establish the exact cause or define every listed ID; conditional interpretations are marked in the entries.',footer:'English is the default. All vendors are assessed by the same evidence standard. Built for local use · No external scripts, analytics or automatic repairs.'},

let lang='en';
try{if(localStorage.getItem('pc-guide-language')==='zh-TW')lang='zh-TW';}catch{}
let expanded=false;
function renderEvents(){
 const t=copy[lang], q=$('search').value.toLocaleLowerCase().trim(), priority=$('priority').value;
 const openKeys=new Set([...document.querySelectorAll('details.event[open]')].map(el=>el.dataset.key));
 const matches=catalog.events.filter(e=>(priority==='all'||e.priority===priority)&&JSON.stringify([e.provider,e.ids,e.en,e['zh-TW']]).toLocaleLowerCase().includes(q));
 $('results').textContent=t.result(matches.length);
 $('events').innerHTML=matches.map(e=>{const c=e[lang];return `<details class="event" data-key="${esc(e.key)}" ${expanded||openKeys.has(e.key)?'open':''}><summary><span class="id">${e.ids.join(' / ')}</span><span class="name"><strong>${esc(e.provider)}</strong><small>${esc(c.title)}</small></span><span class="badge ${e.priority}">${esc(t[e.priority])}</span></summary><div class="body"><p>${esc(c.meaning)}</p><dl><div><dt>${esc(t.evidence)}</dt><dd>${esc(c.evidence)}</dd></div><div><dt>${esc(t.verify)}</dt><dd>${esc(c.verify)}</dd></div></dl><h3>${esc(t.steps)}</h3><ol>${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="avoid"><strong>${esc(t.avoid)}:</strong> ${esc(c.avoid)}</div><div class="refs">${e.sources.length?e.sources.map(k=>`<a href="${esc(catalog.sources[k][1])}">${esc(catalog.sources[k][0])}</a>`).join(''):`<span>${esc(t.unknown)}</span>`}</div></div></details>`}).join('')||`<p class="empty">${esc(t.empty)}</p>`;
}
function render(){
 const t=copy[lang];document.documentElement.lang=lang;document.title=lang==='en'?'PC Troubleshooting | Field Guide':'PC 故障分析｜排查指南';
 const fields={'eyebrow':'eyebrow','heading':'heading','intro':'intro','status':'status','case-title':'caseTitle','case-note':'caseNote','case-limit':'caseLimit','catalog-link':'catalogLink','workflow-link':'workflowLink','report-link':'reportLink','catalog-label':'catalogLabel','catalog-title':'catalogTitle','catalog-intro':'catalogIntro','search-label':'searchLabel','priority-label':'priorityLabel','reset':'reset','timeline-label':'timelineLabel','timeline-title':'timelineTitle','time-note':'timeNote','time-limit':'timeLimit','workflow-label':'workflowLabel','workflow-title':'workflowTitle','workflow-text':'workflowText','workflow-doc':'workflowDoc','evidence-title':'evidenceTitle','case-template':'caseTemplate','privacy':'privacy','sources-title':'sourcesTitle','sources-note':'sourcesNote','footer':'footer'};
 Object.entries(fields).forEach(([id,key])=>$(id).textContent=t[key]);
 Object.entries({'storage-status':'storageStatus','storage-title':'storageTitle','storage-note':'storageNote','storage-case':'storageCase'}).forEach(([id,key])=>$(id).textContent=t[key]);
 $('expand').textContent=expanded?t.collapse:t.expand;$('expand').setAttribute('aria-expanded',String(expanded));
 $('search').placeholder=t.searchPlaceholder;
 const prior=$('priority').value||'all';$('priority').innerHTML=['all','first','symptom','monitor'].map(k=>`<option value="${k}">${esc(t[k])}</option>`).join('');$('priority').value=prior;
 $('en').setAttribute('aria-pressed',String(lang==='en'));$('zh').setAttribute('aria-pressed',String(lang==='zh-TW'));
 const suffix=lang==='en'?'':'.zh-TW';$('report-link').href=`../README${suffix}.md`;$('workflow-doc').href=`../research/workflow${suffix}.md`;$('case-template').href=`../cases/case-template${suffix}.md`;
 $('storage-case').href=`../cases/2026-10-14-kingston-nvme-dropout${suffix}.md`;
 const desc=lang==='en'?['Use full XML, the actual shutdown time and a matching dump.','Identify the exact app, provider or service before repair.','Compare the documented pattern and intended sign-in behavior.']:['使用完整 XML、真正關機時間及相符傾印。','修復前先識別確切程式、提供者或服務。','比對官方模式及預期登入需求。'];
 $('triage').innerHTML=['first','symptom','monitor'].map((k,i)=>`<div class="tile ${k}"><span class="num">0${i+1} / ${esc(t[k])}</span><h3>${['41 · 6008 · 161','1000 · 10029 · 28…','10016 · 360'][i]}</h3><p>${esc(desc[i])}</p></div>`).join('');
 $('timeline-head').innerHTML=`<tr>${t.timelineHead.map(s=>`<th scope="col">${esc(s)}</th>`).join('')}</tr>`;
 $('timeline-body').innerHTML=t.timelineRows.map(row=>`<tr>${row.map(s=>`<td>${esc(s)}</td>`).join('')}</tr>`).join('');
 $('evidence-steps').innerHTML=t.evidenceSteps.map(s=>`<li>${esc(s)}</li>`).join('');
 $('all-sources').innerHTML=Object.values(catalog.sources).map(([name,url])=>`<a href="${esc(url)}">${esc(name)}</a>`).join('');renderEvents();
}
function setLanguage(value){lang=value;try{localStorage.setItem('pc-guide-language',lang);}catch{}render();}
$('en').addEventListener('click',()=>setLanguage('en'));$('zh').addEventListener('click',()=>setLanguage('zh-TW'));
$('search').addEventListener('input',renderEvents);$('priority').addEventListener('change',renderEvents);
$('reset').addEventListener('click',()=>{$('search').value='';$('priority').value='all';renderEvents();});
$('expand').addEventListener('click',()=>{expanded=!expanded;document.querySelectorAll('details.event').forEach(e=>e.open=expanded);$('expand').textContent=expanded?copy[lang].collapse:copy[lang].expand;$('expand').setAttribute('aria-expanded',String(expanded));});
render();
</script>
