name: iam-research-lab

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IAM_LAB_DB_PASSWORD:?Set IAM_LAB_DB_PASSWORD in .env}
    volumes:
      - iam_lab_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    build:
      context: .
      dockerfile: Containerfile
    environment:
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IAM_LAB_DB_PASSWORD:?Set IAM_LAB_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IAM_LAB_ADMIN_PASSWORD:?Set IAM_LAB_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:18080
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_CACHE: local
    command: ["start", "--optimized", "--import-realm"]
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19000:9000"
    volumes:
      - ./iam-lab-realm.json:/opt/keycloak/data/import/iam-lab-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped

volumes:
  iam_lab_db:
